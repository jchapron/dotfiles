# tmux — minimal, vim-flavoured, Catppuccin Mocha. Prefix is C-a.
# prefix r reloads · prefix f sessionizer · prefix h/j/k/l panes · prefix | and - splits

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB,*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -s escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off        # closing a session jumps to the next one instead of exiting
setw -g mode-keys vi
set -g status-keys emacs
set -g allow-passthrough on         # images / OSC from agents inside tmux
set -g monitor-activity on
set -g visual-activity off
set -g bell-action any              # agents ring the bell when they need you
set -g visual-bell off

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"
bind f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind C-f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind s choose-tree -Zs               # session picker
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -n M-[ previous-window
bind -n M-] next-window
bind x kill-pane
bind X kill-session
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# --- Catppuccin Mocha status line (no plugins) ---
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 40
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#181825] "
set -g status-right-length 60
set -g status-right "#[fg=#6c7086]#{?client_prefix,#[fg=#f9e2af]PREFIX ,}#[fg=#a6adc8]#{pane_current_command} #[fg=#6c7086]│ #[fg=#a6adc8]%H:%M "
setw -g window-status-format "#[fg=#6c7086] #I #W#{?window_activity_flag,#[fg=#f9e2af] ●,}#{?window_bell_flag,#[fg=#f38ba8] !,} "
setw -g window-status-current-format "#[fg=#cdd6f4,bg=#313244,bold] #I #W "
setw -g window-status-separator ""
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
